name: Build Power BI visual

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p .

      # E2 (T3): automated regression suite for the highest-risk logic (color resolution,
      # setData()/segment handling). Runs before packaging so a regression blocks the build
      # the same way a type-check failure does, rather than only surfacing after a .pbiviz
      # has already been produced and released.
      - name: Run unit tests
        run: npm run test:ci

      - name: Package the visual
        run: npx pbiviz package

      - name: Find the built .pbiviz file
        id: find_pbiviz
        shell: bash
        run: |
          FILE=$(ls dist/*.pbiviz | head -n 1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Upload as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: skiba-tables-pbiviz
          path: dist/*.pbiviz
          retention-days: 30

      - name: Publish/update "latest" release with the .pbiviz attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Auto-built from the latest push to main. Not a stable/versioned release — just the newest working .pbiviz.
          files: dist/*.pbiviz
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
